name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # persist turbo's local cache between runs — unchanged workspaces get
      # cache hits for check/test/build instead of cold-running every push
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # tsc --noEmit across all workspaces (via turbo)
      - run: npm run check

      # vitest across workspaces that define a `test` script; runs inside the
      # required `check` job so branch protection gates on it
      - run: npm test

      # bundle-size gate: builds Vault (turbo dependsOn) and fails if gzipped
      # assets exceed budget — guards against the full dataset being bundled
      - run: npx turbo run size
