name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc --noEmit today; app workspaces join automatically once they add
      # their own `check` scripts (root runs --workspaces --if-present)
      - run: npm run check

      # vitest across workspaces that define a `test` script; runs inside the
      # required `check` job so branch protection gates on it
      - run: npm test
