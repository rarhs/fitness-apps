# Smoke: the app boots and the licensing attribution is present.
# No `url` here (or in any test in this suite) — the base URL comes from
# `--url-override`, so the same tests run against previews, prod or localhost.
fileType: momentic/test/v2
id: home-loads
description: The home page renders the exercise library app and the Gym Visual media attribution.
steps:
  - assert: the page is a fitness exercise library app called Vault
  - assert: the number 1,324 is visible somewhere on the page
  - act: scroll to the bottom of the page
  - assert: an attribution crediting Gym Visual is visible
